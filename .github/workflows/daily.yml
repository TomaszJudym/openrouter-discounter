name: daily

on:
  schedule:
    # 22:00 UTC = 07:00 JST; JST has no DST, so a fixed cron is exact.
    # Telegram report and presets.
    - cron: '0 22 * * *'
    # Every 2 h between: presets only (TRACKER_REPORT=false), so a pick
    # whose discount ended is replaced within hours. provider.max_price
    # already stops it billing list price; the rerun restores routing.
    # Prices average over a 4 h Horizon: one missed run is covered.
    # Off the hour: GitHub delays and drops top-of-hour schedules.
    - cron: '7 0-20/2 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-discount
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Build and run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
          # optional: Darkbloom-direct prices (dbproxy routes them)
          DARKBLOOM_API_KEY: ${{ secrets.DARKBLOOM_API_KEY }}
          TRACKER_REPORT: ${{ github.event.schedule != '7 0-20/2 * * *' }}
        run: |
          go build -o tracker ./cmd/tracker
          ./tracker

  checks:
    # CI gate: build, vet, race-test, and lint. Not on schedules: the
    # intra-day runs only repoint presets, the code has not changed.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Race test
        run: go test -race -count=1 ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: ./...

  keepalive:
    # Required: GitHub disables scheduled workflows after 60 days of repo
    # inactivity. This job re-enables the workflow via the API (no dummy
    # commits). gautamkrishnar/keepalive-workflow is ToS-blocked upstream.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
